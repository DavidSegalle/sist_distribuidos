syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.examples.routeguide";
option java_outer_classname = "RouteGuideProto";
option objc_class_prefix = "RTG";

package routeguide;



service RouteGuide {
    // Candidate president sends this message with his id for all other server nodes. Server node reply with their vote
    rpc TryBecomePresident(Id) returns (Vote) {}

    rpc WriteInfo(Info) returns () {}

    rpc FetchRequest() returns (Info) {}
}

message Id {
  int32 id = 1;
}

message Vote {
    bool accepted = 2;
}

message Info {
    string message = 3; // No write info é a string da mensagem a ser gravada, no fetch request é as informações realizadas no banco de dados
}